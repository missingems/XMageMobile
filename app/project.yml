name: XMageMobile
options:
  bundleIdPrefix: com.missingems
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: 25WL36ABTN
    SWIFT_VERSION: "6.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "10"
targets:
  XMageMobile:
    type: application
    platform: iOS
    sources:
      - path: XMageMobile
      - path: ../vendor/xmage/xmage/mage-client/sample-decks
        type: folder
        buildPhase: resources
      - path: ../decks
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Frameworks/XMageBridge.xcframework
        embed: false
      - sdk: CFNetwork.framework
      - sdk: CoreServices.framework
      - sdk: libz.tbd
      - sdk: libc++.tbd
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.missingems.XMageMobile
        PRODUCT_NAME: XMage
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        INFOPLIST_KEY_CFBundleDisplayName: XMage
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "XMage connects to the bridge running on your Mac or home server."
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
    info:
      path: XMageMobile/Resources/Info.plist
      properties:
        UIAppFonts:
          - Planewalker-Bold.otf
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSAllowsArbitraryLoads: true
